store_id: "aldi"
display_name: "Aldi"
language: "nl_fr"
bilingual_dedup: true

validity_format: >
  "Geldig van dinsdag DD/MM tot zaterdag DD/MM" or
  "Valable du mardi DD/MM au samedi DD/MM"

store_brands:
  - name: "milsani"
    description: "Dairy house brand"
  - name: "moser roth"
    description: "Premium chocolate brand"
  - name: "gourmet"
    description: "Premium food line"
  - name: "cucina"
    description: "Italian/pasta line"
  - name: "río d'oro"
    description: "Juice brand"
  - name: "golden seafood"
    description: "Fish/seafood brand"
  - name: "farmdale"
    description: "Dairy/farm brand"
  - name: "snackday"
    description: "Snacks brand"
  - name: "belbake"
    description: "Baking brand"
  - name: "almare"
    description: "Fish brand"
  - name: "trader joe's"
    description: "Premium specialty brand"
  - name: "lacura"
    description: "Personal care brand"
  - name: "tandil"
    description: "Cleaning products brand"
  - name: "mamia"
    description: "Baby products brand"

promo_mechanisms:
  - label: "Super Deal"
    aliases: ["Super Promo"]
    description: "Highlighted weekly deal"
  - label: "-30%"
    aliases: []
    description: "Percentage discount (also -25%, -20%, -40%, -50%, etc.)"
  - label: "1+1 gratis"
    aliases: ["1+1 gratuit"]
    description: "Buy one get one free. promo_price = price of one item"
  - label: "X voor €Y"
    aliases: ["X pour €Y"]
    description: "Multi-buy deal (set promo_price to per-unit price €Y/X)"

normalized_name_examples:
  - input: "Milsani Volle Melk 1L"
    output: "volle melk"
  - input: "Moser Roth Chocolade Puur 70% 125g"
    output: "chocolade puur 70%"
  - input: "Coca-Cola Zero 1,5L"
    output: "cola zero"
  - input: "Snackday Chips Naturel 200g"
    output: "chips naturel"

content_examples:
  - input: "1L"
    pack_size: 1
    content_value: 1
    content_unit: "l"
  - input: "125g"
    pack_size: 1
    content_value: 125
    content_unit: "g"
  - input: "6x33cl"
    pack_size: 6
    content_value: 33
    content_unit: "cl"

price_rules:
  original_price: "nullable"
  promo_price: "nullable"

normalized_name_guidance: >
  Aldi uses many house brands. Always strip the brand from normalized_name.
  Many Aldi products are house brand only — if no brand is recognizable, set normalized_brand to null.

price_calculation_table: null
extra_rules:
  - "Aldi folders often show weekly specials (dinsdag-zaterdag) and themed specials separately — extract all"
validation_checklist: []
