store_id: "delhaize"
display_name: "Delhaize"
language: "nl_fr"
bilingual_dedup: true

validity_format: >
  "donderdag DD/MM -> woensdag DD/MM/YYYY" or
  "jeudi DD/MM -> mercredi DD/MM/YYYY"

store_brands:
  - name: "delhaize"
    description: "Standard Delhaize house brand"
  - name: "365"
    description: "Budget/economy brand (cheapest tier)"
  - name: "taste of inspirations"
    description: "Premium culinary house brand"
  - name: "care"
    description: "Health and body care house brand"

promo_mechanisms:
  # ── SuperPlus formatting rule ──────────────────────────────────────────
  # Many Delhaize deals require the SuperPlus loyalty card.
  # ALWAYS format SuperPlus as a SUFFIX in parentheses: "(SuperPlus)".
  # NEVER prefix with "SuperPlus:", "SuperPlus " or suffix with " SuperPlus", " Met SuperPlus".
  # Examples:  "1+1 Gratis (SuperPlus)"  ✓      "SuperPlus: 1+1 Gratis"  ✗
  #            "2e Tegen -50% (SuperPlus)"  ✓    "2e Tegen -50% Met SuperPlus"  ✗
  #            "-25% (SuperPlus)"  ✓              "SuperPlus -25%"  ✗
  # If the deal does NOT require SuperPlus, omit it entirely.

  - label: "X+Y Gratis"
    aliases: ["X+Y Gratuit"]
    description: >
      Buy X get Y free — covers all volume deals (1+1, 2+1, 2+2, 3+1, 3+2, 3+3, 4+1, 5+1, etc.).
      Output the exact numbers seen. promo_price = original_price (shelf price of one item, not the bundle total).
      Output format: "{X}+{Y} Gratis" or "{X}+{Y} Gratis (SuperPlus)" if loyalty card required.
      Examples: "1+1 Gratis", "2+1 Gratis (SuperPlus)", "3+3 Gratis (SuperPlus)", "4+1 Gratis".

  - label: "2e Tegen -X%"
    aliases: ["2ème à -X%", "2de schaal tegen -X%", "2e schaal tegen -X%", "2e aan halve prijs", "2ème à moitié prix", "2e aan -X%"]
    description: >
      Percentage discount on the second item (e.g., 2e tegen -50%, 2e tegen -40%, 2e tegen -60%).
      promo_price = original_price.
      IMPORTANT: "2e aan halve prijs" / "2e à moitié prix" = "2e Tegen -50%". Always output as "2e Tegen -50%".
      IMPORTANT: "2e schaal tegen -X%" (second tray at -X%) = "2e Tegen -X%". Drop "Schaal" — it's a product detail, not a mechanism.
      Output format: "2e Tegen -{pct}%" or "2e Tegen -{pct}% (SuperPlus)" if loyalty card required.
      Examples: "2e Tegen -50%", "2e Tegen -40% (SuperPlus)", "2e Tegen -60% (SuperPlus)".

  - label: "-X%"
    aliases: []
    description: >
      Flat percentage discount on a single item (e.g., -30%, -25%, -20%).
      Only use bare "-X%" when the discount applies to ONE item with no minimum purchase.
      Output format: "-{pct}%" or "-{pct}% (SuperPlus)" if loyalty card required.
      Examples: "-25%", "-20% (SuperPlus)", "-10% (SuperPlus)".

  - label: "-X% Vanaf Y"
    aliases: ["-X% à partir de Y"]
    description: >
      Percentage discount conditional on buying a minimum quantity.
      Output format: "-{pct}% Vanaf {qty} {unit}" or "-{pct}% Vanaf {qty} {unit} (SuperPlus)".
      Use the correct unit: Verpakkingen, Flessen, Blikken, Bokalen, Bakken, Producten.
      Examples: "-20% Vanaf 3 Verpakkingen (SuperPlus)", "-25% Vanaf 2 Flessen".

  - label: "-€X Korting"
    aliases: ["-€X korting", "Korting", "-€X réduction"]
    description: >
      Fixed euro discount (e.g., -€4, -€1.25, -€0.70).
      Output format: "-€{amount} Korting" or "-€{amount} Korting (SuperPlus)" if loyalty card required.
      For conditional quantities: "-€{amount} Korting Vanaf {qty} {unit}" or with "(SuperPlus)".
      Examples: "-€0.70 Korting", "-€4 Korting (SuperPlus)", "-€5 Korting Vanaf 3 Verpakkingen (SuperPlus)".

  - label: "X Voor €Y"
    aliases: ["X pour €Y"]
    description: >
      Multi-buy deal (set promo_price to per-unit price €Y/X).
      Output format: "{qty} Voor €{price}" or "{qty} Voor €{price} (SuperPlus)" if loyalty card required.
      Examples: "3 Voor €4.30", "3 Voor €5 (SuperPlus)", "4 Voor €12 (SuperPlus)".

  - label: "Sunday Deal"
    aliases: []
    description: "Promo only valid on Sunday. Output exactly: 'Sunday Deal'."

  - label: "New Deal"
    aliases: ["Deal"]
    description: "Highlighted deal — extract as a normal promo with its actual mechanism, not as 'New Deal'."

price_calculation_table: |
  ### DELHAIZE BUNDLE PRICING (CRITICAL)
  Delhaize folders frequently present volume deals showing the TOTAL bundle prices for both original and promo.
  The layout is usually: `[Crossed-out Total] [Promo Total]/[Quantity]`

  Example 1 (1+1 Gratis): "2 x emmentaler, 150 g — 3,30 1,65/2"
  - "3,30" is the TOTAL original price for 2 items.
  - "1,65/2" means the TOTAL promo price is €1.65 for 2 items.
  - You MUST extract PER-ITEM pricing:
    - original_price: €1.65 (= €3.30 ÷ 2)
    - promo_price: €1.65 (same as original_price for X+Y Gratis deals)

  Example 2 (2e tegen -50%): "2 x smeerkaas natuur — 5,98 4,49/2"
  - "5,98" is the TOTAL original price for 2 items.
  - "4,49/2" is the TOTAL promo price for 2 items.
  - You MUST extract PER-ITEM pricing:
    - original_price: €2.99 (= €5.98 ÷ 2)
    - promo_price: €2.99 (same as original_price for 2e tegen -X% deals, the frontend will calculate the effective price)

  Example 3 (Wine 2+1 Gratis): "35,97 23,98/3 — HETZIJ 7,99/FLES BIJ AANKOOP VAN 3"
  - "35,97" is the total original price for 3 bottles.
  - "23,98/3" is the total promo price for 3 bottles.
  - original_price: €11.99 (= €35.97 ÷ 3)
  - promo_price: €11.99 (same as original_price for X+Y Gratis deals)

  **How to handle:**
  If you see a price format like "X,XX Y,YY/Z", always divide X,XX by Z to get the single-unit `original_price`. Look for "HETZIJ X,XX/stuk" as a helpful indicator for per-unit calculations.

extra_rules:
  - "Delhaize relies heavily on the 'SuperPlus' loyalty program. If a deal requires SuperPlus, append ' (SuperPlus)' at the END of display_mechanism. NEVER prefix or use other formats like 'SuperPlus:', 'SuperPlus -', 'Met SuperPlus'."
  - "Always calculate and extract the PER-ITEM original price, never the total bundle price."
  - "Delhaize folders often display the Nutri-Score (e.g., A, B, C, D, E). Do not confuse this with product names or brands."
  - "'2e aan halve prijs' must be output as '2e Tegen -50%'. '2e schaal tegen -X%' must be output as '2e Tegen -X%' (drop 'Schaal')."
validation_checklist:
  - "For X+Y Gratis and 2e tegen -X% deals, bundle prices have been divided by the total deal quantity to extract single-unit pricing."
  - "promo_price equals original_price for X+Y Gratis and 2e tegen -X% deals."
  - "display_mechanism uses the EXACT canonical format: SuperPlus is ONLY in '(SuperPlus)' suffix form, NEVER as prefix."
  - "display_mechanism uses Title Case: '2e Tegen -50%' not '2e tegen -50%', 'Gratis' not 'gratis'."
  - "'2e aan halve prijs' has been converted to '2e Tegen -50%'. '2e schaal tegen' has been converted to '2e Tegen'."
