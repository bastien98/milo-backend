store_id: "colruyt"
display_name: "Colruyt"
language: "nl_fr"
bilingual_dedup: true

validity_format: >
  "Geldig van DD/MM tot DD/MM" or "Valable du DD/MM au DD/MM"

store_brands:
  - name: "boni"
    description: "Standard store brand (mid-range)"
  - name: "boni selection"
    description: "Premium house brand"
  - name: "everyday"
    description: "Budget/economy brand"
  - name: "cru"
    description: "Premium delicatessen brand"

promo_mechanisms:
  - label: "Laagste Prijs"
    aliases: ["Prix le plus bas"]
    description: "Core promise — regular promos, extract normally"
  - label: "1+1 gratis"
    aliases: ["1+1 gratuit"]
    description: "Buy one get one free. promo_price = price of one item"
  - label: "2e aan halve prijs"
    aliases: ["2ème à moitié prix"]
    description: "Second item at half price"
  - label: "2+1 gratis"
    aliases: ["2+1 gratuit"]
    description: "Buy 2 get 1 free"
  - label: "-30%"
    aliases: []
    description: "Percentage discount on the item (also -25%, -20%, etc.)"
  - label: "€X.XX korting"
    aliases: ["€X.XX réduction"]
    description: "Fixed euro discount"
  - label: "X voor €Y"
    aliases: ["X pour €Y"]
    description: "Multi-buy deal (set promo_price to per-unit price €Y/X)"
  - label: "Mega Deal"
    aliases: []
    description: "Highlighted deal — extract as a normal promo with its mechanism"

normalized_name_examples:
  - input: "Jupiler Pils Blikken 24x25cl"
    output: "pils"
  - input: "Boni Volle Melk 1L"
    output: "volle melk"
  - input: "Coca-Cola Zero 1,5L PET"
    output: "cola zero"
  - input: "Lay's Chips Paprika 250g"
    output: "chips paprika"
  - input: "Danone Activia Aardbei 4x125g"
    output: "yoghurt aardbei"
  - input: "Leffe Bruin Flessen 6x33cl"
    output: "bruin bier"
  - input: "Everyday Spaghetti 500g"
    output: "spaghetti"
  - input: "Dove Douchegel Original 250ml"
    output: "douchegel"

content_examples:
  - input: "6x33cl"
    pack_size: 6
    content_value: 33
    content_unit: "cl"
  - input: "500g"
    pack_size: 1
    content_value: 500
    content_unit: "g"
  - input: "1,5L"
    pack_size: 1
    content_value: 1.5
    content_unit: "l"
  - input: "24x25cl"
    pack_size: 24
    content_value: 25
    content_unit: "cl"

price_rules:
  original_price: "nullable"
  promo_price: "nullable"

normalized_name_guidance: null
price_calculation_table: null
extra_rules: []
validation_checklist: []
