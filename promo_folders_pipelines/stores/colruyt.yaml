store_id: "colruyt"
display_name: "Colruyt"
language: "nl_fr"
bilingual_dedup: true

validity_format: >
  "Geldig van DD/MM t.e.m. DD/MM" or "Valable du DD/MM au DD/MM"

store_brands:
  - name: "boni"
    description: "Standard store brand (mid-range)"
  - name: "boni selection"
    description: "Premium house brand"
  - name: "everyday"
    description: "Budget/economy brand"
  - name: "boni plan't"
    description: "Plant-based sub-brand (falafels, lentils, vegan gyros, seitan)"
  - name: "cru"
    description: "Premium delicatessen brand"

promo_mechanisms:
  - label: "X+Y gratis"
    aliases: ["X+Y gratuit"]
    description: "Buy X get Y free — covers all volume deals (e.g. 1+1, 2+1, 2+2, 3+1, 4+1, 5+1, 8+4, 9+3, 12+6, 18+6). Output the exact numbers seen (e.g. '8+4 gratis'). promo_price = original_price (shelf price of one item, not the effective price)."
  - label: "2e aan halve prijs"
    aliases: ["2ème à moitié prix"]
    description: "Second item at half price"
  - label: "-X%"
    aliases: []
    description: "Flat percentage discount on the item (e.g. -20%, -25%, -30%, -40%)"
  - label: "-X% vanaf Y verpakkingen"
    aliases: ["-X% à partir de Y"]
    description: "Tiered percentage discount conditional on buying a minimum quantity (e.g. '-15% vanaf 2 verpakkingen', '-25% vanaf 4 verpakkingen'). Output the exact percentages and quantities seen. Can appear as multiple tiers on the same product."
  - label: "€X.XX korting"
    aliases: ["€X.XX réduction"]
    description: "Fixed euro discount"
  - label: "X voor €Y"
    aliases: ["X pour €Y"]
    description: "Multi-buy deal (set promo_price to per-unit price €Y/X)"
  - label: "Mega Deal"
    aliases: []
    description: "Highlighted deal — extract as a normal promo with its mechanism"


price_calculation_table: null
extra_rules:
  - "SKIP items whose only promotion is 'Rode Prijzen' or 'Laagste Prijs' — these are Colruyt's permanent price-match guarantees, not time-limited promotional deals. Only extract items with a real promotional mechanism (1+1, -25%, 2e halve prijs, etc.)."
validation_checklist: []
