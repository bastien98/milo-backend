store_id: "spar"
display_name: "Spar"
language: "nl_fr"
bilingual_dedup: true

validity_format: >
  "Geldig van DD/MM tot DD/MM" or "Valable du DD/MM au DD/MM"

store_brands:
  - name: "spar"
    description: "Spar house brand (operated by Colruyt Group in Belgium)"
  - name: "boni"
    description: "Standard store brand (shared with Colruyt Group)"
  - name: "everyday"
    description: "Budget/economy brand (shared with Colruyt Group)"

promo_mechanisms:
  - label: "1+1 gratis"
    aliases: ["1+1 gratuit"]
    description: "Buy one get one free. promo_price = price of one item"
  - label: "-30%"
    aliases: []
    description: "Percentage discount (also -25%, -20%, etc.)"
  - label: "2e aan halve prijs"
    aliases: ["2ème à moitié prix"]
    description: "Second item at half price"
  - label: "X voor €Y"
    aliases: ["X pour €Y"]
    description: "Multi-buy deal (set promo_price to per-unit price €Y/X)"

normalized_name_examples:
  - input: "Jupiler Pils 6x33cl"
    output: "pils"
  - input: "Spar Kaas Gouda Jong 400g"
    output: "kaas gouda jong"
  - input: "Boni Boter Ongezouten 250g"
    output: "boter ongezouten"

content_examples:
  - input: "6x33cl"
    pack_size: 6
    content_value: 33
    content_unit: "cl"
  - input: "400g"
    pack_size: 1
    content_value: 400
    content_unit: "g"

price_rules:
  original_price: "nullable"
  promo_price: "nullable"

normalized_name_guidance: null
price_calculation_table: null
extra_rules: []
validation_checklist: []
