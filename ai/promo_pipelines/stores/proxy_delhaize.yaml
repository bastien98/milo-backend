store_id: "proxy delhaize"
display_name: "Proxy Delhaize"
language: "nl_fr"
bilingual_dedup: true

validity_format: >
  "Geldig van donderdag DD/MM tot woensdag DD/MM" or
  "Valable du jeudi DD/MM au mercredi DD/MM"

store_brands:
  - name: "delhaize"
    description: "Standard Delhaize house brand"
  - name: "365"
    description: "Budget/economy brand"

promo_mechanisms:
  - label: "SuperPlus"
    aliases: []
    description: "Delhaize loyalty card discount"
  - label: "1+1 gratis"
    aliases: ["1+1 gratuit"]
    description: "Buy one get one free. promo_price = price of one item"
  - label: "-30%"
    aliases: []
    description: "Percentage discount (also -25%, -20%, etc.)"
  - label: "X voor €Y"
    aliases: ["X pour €Y"]
    description: "Multi-buy deal (set promo_price to per-unit price €Y/X)"

normalized_name_examples:
  - input: "Jupiler Pils 6x33cl"
    output: "pils"
  - input: "Delhaize Kaas Emmental 200g"
    output: "kaas emmental"
  - input: "365 Rijst Basmati 1kg"
    output: "rijst basmati"

content_examples:
  - input: "6x33cl"
    pack_size: 6
    content_value: 33
    content_unit: "cl"
  - input: "1kg"
    pack_size: 1
    content_value: 1
    content_unit: "kg"

price_rules:
  original_price: "nullable"
  promo_price: "nullable"

normalized_name_guidance: null
price_calculation_table: null
extra_rules: []
validation_checklist: []
