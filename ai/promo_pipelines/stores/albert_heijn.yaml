store_id: "albert heijn"
display_name: "Albert Heijn"
language: "nl"
bilingual_dedup: false

validity_format: >
  "Geldig van maandag DD/MM tot zondag DD/MM" (Bonus week)

store_brands:
  - name: "ah"
    description: "Standard Albert Heijn house brand"
  - name: "ah basic"
    description: "Budget/economy brand"
  - name: "ah excellent"
    description: "Premium house brand"
  - name: "ah biologisch"
    description: "Organic house brand"
  - name: "ah terra"
    description: "Plant-based house brand"

promo_mechanisms:
  - label: "Bonus"
    aliases: []
    description: "Weekly Bonus deal — the main AH promo mechanism"
  - label: "1+1 gratis"
    aliases: []
    description: "Buy one get one free. promo_price = price of one item"
  - label: "2e halve prijs"
    aliases: []
    description: "Second item at half price"
  - label: "25% korting"
    aliases: []
    description: "Percentage discount (also 30%, 35%, 40%, etc.)"
  - label: "X voor €Y"
    aliases: []
    description: "Multi-buy deal (set promo_price to per-unit price €Y/X)"
  - label: "2+1 gratis"
    aliases: []
    description: "Buy 2 get 1 free"

normalized_name_examples:
  - input: "Jupiler Pils Blikken 24x25cl"
    output: "pils"
  - input: "AH Volle Melk 1L"
    output: "volle melk"
  - input: "AH Basic Spaghetti 500g"
    output: "spaghetti"
  - input: "Coca-Cola Zero 1,5L PET"
    output: "cola zero"
  - input: "AH Excellent Biologische Yoghurt 500g"
    output: "biologische yoghurt"
  - input: "Lay's Chips Paprika 250g"
    output: "chips paprika"
  - input: "Hertog Jan Pilsener Flessen 6x30cl"
    output: "pilsener"

content_examples:
  - input: "24x25cl"
    pack_size: 24
    content_value: 25
    content_unit: "cl"
  - input: "1L"
    pack_size: 1
    content_value: 1
    content_unit: "l"
  - input: "500g"
    pack_size: 1
    content_value: 500
    content_unit: "g"

price_rules:
  original_price: "mandatory"
  promo_price: "mandatory"

normalized_name_guidance: >
  AH Bonus folders always show both original and Bonus price. Both MUST be extracted.
  AH products often use Dutch-only descriptions. Keep the Dutch product name.

price_calculation_table: |
  ### PRICE EXTRACTION (MANDATORY)
  AH Bonus folders always show BOTH prices. You MUST extract both:
  - original_price: the regular/doorstreept price (crossed out)
  - promo_price: the Bonus/promotional price (highlighted)

  NEVER set either price to null unless truly not visible on the page.

extra_rules:
  - "AH folders are Dutch only — no bilingual deduplication needed"
  - "AH Bonus items always show both original and Bonus price — extract both"
  - "AH uses 'Bonus' as the primary mechanism label"
validation_checklist:
  - "Both original_price and promo_price are extracted (MANDATORY for AH)"
